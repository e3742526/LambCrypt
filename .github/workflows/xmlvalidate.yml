name: Validate XML

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/Common/Language.xml'
      - 'src/Release/Setup Files/*.wxl'
      - 'Translations/**'
      - '.github/workflows/xmlvalidate.yml'
      - '.github/workflows/validate_translation_formats.py'
      - 'Tests/test_xmlvalidate.py'
      - 'Tests/test_translation_formats.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/Common/Language.xml'
      - 'src/Release/Setup Files/*.wxl'
      - 'Translations/**'
      - '.github/workflows/xmlvalidate.yml'
      - '.github/workflows/validate_translation_formats.py'
      - 'Tests/test_xmlvalidate.py'
      - 'Tests/test_translation_formats.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Test XML validator
      run: python3 Tests/test_xmlvalidate.py
    - name: Test translation format validator
      run: python3 Tests/test_translation_formats.py
    - name: Validate the built-in English catalogue
      run: python3 .github/workflows/validate_translation_formats.py --english-only "${{ github.workspace }}"
